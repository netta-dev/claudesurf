<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClaudeSurf session</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #1a1a1a; color: #e0e0e0; }
    h1 { margin: 0 0 .5rem; font-size: 1.5rem; }
    .id { font-family: ui-monospace, monospace; background: #2a2a2a; padding: .15rem .4rem; border-radius: 3px; color: #f0f0f0; font-size: .85rem; }
    .name { font-size: 2rem; margin: 0 0 .5rem; color: #f5f5f5; }
    .description { color: #ccc; margin: .5rem 0 1.5rem; white-space: pre-wrap; font-size: 1.25rem; }
    .hint { color: #888; margin-top: 1.5rem; font-size: .9rem; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1 class="name" id="sessionName" hidden></h1>
  <div>ClaudeSurf session <span class="id" id="shortId"></span></div>
  <div class="description" id="sessionDescription" hidden></div>
  <div>Started <span id="startedAt"></span></div>
  <div class="hint">This window is dedicated to one Claude Code session. Tool calls from that session will appear in the tab to the right.</div>
  <script src="session.js"></script>
</body>
</html>
