<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ClaudeSurf session</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23d97706'/%3E%3Cpath d='M6 20c4-8 8-8 10 0s6 8 10 0' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    body { font-family: system-ui, sans-serif; padding: 2rem; background: #1a1a1a; color: #e0e0e0; }
    .id { font-family: ui-monospace, monospace; background: #2a2a2a; padding: .15rem .4rem; border-radius: 3px; color: #f0f0f0; font-size: .85rem; }
    .name { font-size: 2rem; margin: 0 0 .5rem; color: #f5f5f5; }
    .description { color: #ccc; margin: .5rem 0 1.5rem; white-space: pre-wrap; font-size: 1.25rem; }
    .hint { color: #888; margin-top: 1.5rem; font-size: .9rem; }
    .links { margin-top: 2rem; font-size: .8rem; }
    .links a { color: #666; margin-right: 1rem; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1 class="name" id="sessionName" hidden></h1>
  <div>ClaudeSurf session <span class="id" id="shortId"></span></div>
  <div class="description" id="sessionDescription" hidden></div>
  <div>Started <span id="startedAt"></span></div>
  <div class="hint" id="hint"></div>
  <div class="links">
    <a id="working-link" target="_blank" rel="opener">working tab</a>
    <a id="identity-link" target="_blank" rel="opener">identity tab</a>
  </div>
  <script>
    // Role, session id, and start time arrive in the URL fragment:
    //   #role=identity&session=<session id>&started=<ISO time>
    // The daemon reads the fragment back off targets to claim them, and clicks the two
    // links above to open a tab of the other role in this window.
    const params = new URLSearchParams(location.hash.slice(1));
    const role = params.get('role') || 'working';
    const sessionId = params.get('session') || '';
    const startedAt = params.get('started') || '';
    const shortId = sessionId.slice(0, 8);
    const base = location.href.split('#')[0];
    const fragment = (r) => `#role=${r}&session=${encodeURIComponent(sessionId)}&started=${encodeURIComponent(startedAt)}`;
    document.getElementById('working-link').href = base + fragment('working');
    document.getElementById('identity-link').href = base + fragment('identity');
    document.getElementById('shortId').textContent = shortId || '?';
    document.getElementById('startedAt').textContent = startedAt ? new Date(startedAt).toLocaleString() : '?';
    document.getElementById('hint').textContent = role === 'identity'
      ? 'This window is dedicated to one Claude Code session; its tool calls appear in the working tab.'
      : 'This is the working tab; the next navigate call from the session loads a page here.';

    // Called by the daemon with the session label; arguments are values, never markup.
    function render(name, description) {
      const nameEl = document.getElementById('sessionName');
      const descEl = document.getElementById('sessionDescription');
      if (name) {
        nameEl.textContent = name;
        nameEl.hidden = false;
        document.title = name;
      } else {
        nameEl.hidden = true;
        document.title = `ClaudeSurf session ${shortId}`;
      }
      descEl.textContent = description || '';
      descEl.hidden = !description;
    }
    render('', '');
  </script>
</body>
</html>
