<!doctype html>
<!-- Its light DOM is final once parsed. A custom element's open shadow root shows a
     placeholder until /delay answers 200 ms after the page asks; the root then fills
     itself in, a step every 300 ms, the last 900 ms after the answer. The
     custom element attaches its shadow root as the parser creates it, so the root
     exists before DOMContentLoaded. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Late shadow</title>
  <script>
    customElements.define('x-feed', class extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' }).innerHTML = '<p>Feed loading…</p>';
      }

      show(text) {
        this.shadowRoot.querySelector('p').textContent = text;
      }
    });
  </script>
</head>
<body>
  <main>
    <h1>Late shadow</h1>
    <p>The light DOM stays as it was parsed.</p>
    <x-feed id="feed"></x-feed>
  </main>
  <script>
    const feed = document.getElementById('feed');
    fetch('/delay?ms=200').then((response) => response.text()).then(() => {
      ['Feed step 1', 'Feed step 2', 'Shadow content: final'].forEach((text, i) => setTimeout(() => feed.show(text), 300 * (i + 1)));
    });
  </script>
</body>
</html>
